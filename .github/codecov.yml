coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_not_found: error
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 5%
        if_not_found: success
        informational: true

comment: false

ignore:
  - "tests/**"
  - "**/__init__.py"
